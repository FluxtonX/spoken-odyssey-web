<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 320" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="spaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="35%" stop-color="#05102a" />
      <stop offset="70%" stop-color="#0a193b" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Planet Body Gradient (Oceanic Depths) -->
    <radialGradient id="planetBody" cx="30%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.95" />
      <stop offset="22%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="80%" stop-color="#0e172e" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Atmosphere Rim Gradient -->
    <linearGradient id="atmoGlow" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="15%" stop-color="#67e8f9" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="80%" stop-color="#1d4ed8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </linearGradient>

    <!-- Sunburst Flare -->
    <radialGradient id="sunCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="15%" stop-color="#fffbeb" stop-opacity="0.95" />
      <stop offset="32%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="85%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- Horizontal Lens Flare Ray -->
    <linearGradient id="flareRay" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- City Lights Gold Glow -->
    <radialGradient id="cityGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.85" />
      <stop offset="80%" stop-color="#d97706" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0" />
    </radialGradient>

    <!-- Moon Shading Gradient -->
    <radialGradient id="moonGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="95%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </radialGradient>

    <!-- Blur and Glow Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="wideGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
    </filter>
    <filter id="sunBloom" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="28" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Clip Path for Earth's Curvature -->
    <clipPath id="earthClip">
      <path d="M -50,250 C 350,25 1100,35 1650,195 L 1650,340 L -50,340 Z" />
    </clipPath>
  </defs>

  <!-- 1. Deep Cosmic Space Background -->
  <rect width="1600" height="320" fill="url(#spaceGrad)" />

  <!-- 2. Distant Stars Field in Deep Space -->
  <g fill="#ffffff">
    <circle cx="80" cy="35" r="1.1" opacity="0.8" />
    <circle cx="190" cy="20" r="0.8" opacity="0.5" />
    <circle cx="380" cy="18" r="1.4" opacity="0.9" />
    <circle cx="560" cy="15" r="0.7" opacity="0.4" />
    <circle cx="720" cy="22" r="1.0" opacity="0.6" />
    <circle cx="910" cy="16" r="0.9" opacity="0.5" />
    <circle cx="1080" cy="28" r="1.3" opacity="0.7" />
    <circle cx="1240" cy="18" r="1.0" opacity="0.6" />
    <circle cx="1360" cy="32" r="1.2" opacity="0.8" />
    <circle cx="1520" cy="25" r="1.0" opacity="0.5" />
    <circle cx="1570" cy="65" r="1.3" opacity="0.7" />
    <circle cx="1490" cy="105" r="0.8" opacity="0.5" />
  </g>

  <!-- 3. Celestial Moon Sphere (Upper Right, completely visible) -->
  <g transform="translate(1420, 52)">
    <!-- Soft Celestial Glow -->
    <circle cx="0" cy="0" r="30" fill="#93c5fd" opacity="0.18" filter="url(#softGlow)" />
    <!-- Moon Body -->
    <circle cx="0" cy="0" r="20" fill="url(#moonGrad)" />
    <!-- Subtle Maria Textures -->
    <ellipse cx="-5" cy="-3" rx="5" ry="7" fill="#64748b" opacity="0.32" transform="rotate(-20 -5 -3)" />
    <ellipse cx="4" cy="6" rx="5" ry="4" fill="#64748b" opacity="0.3" />
    <circle cx="6" cy="-4" r="3" fill="#64748b" opacity="0.25" />
    <circle cx="-6" cy="6" r="3" fill="#475569" opacity="0.28" />
  </g>

  <!-- 4. Deep Atmospheric Aurora Glow Behind Limb -->
  <path d="M -50,250 C 350,20 1100,30 1650,195" fill="none" stroke="#38bdf8" stroke-width="32" opacity="0.28" filter="url(#wideGlow)" />
  <path d="M -50,250 C 350,22 1100,32 1650,195" fill="none" stroke="#60a5fa" stroke-width="16" opacity="0.45" filter="url(#wideGlow)" />

  <!-- 5. Main Curved Earth Body -->
  <path d="M -50,250 C 350,25 1100,35 1650,195 L 1650,340 L -50,340 Z" fill="url(#planetBody)" />

  <!-- 6. Clipped Planet Surface (Continents, Clouds, Night City Lights) -->
  <g clip-path="url(#earthClip)">
    <!-- Continental Outlines (European & Mediterranean Basins) -->
    <!-- Iberian Peninsula & Western Europe -->
    <path d="M 620,195 Q 670,175 720,195 T 800,230 T 840,300 T 730,330 T 600,290 T 590,230 Z" fill="#0f172a" opacity="0.75" />
    <!-- Central Europe & Alps -->
    <path d="M 740,155 Q 800,135 880,155 T 980,185 T 1030,245 T 940,285 T 840,245 T 770,200 Z" fill="#0f172a" opacity="0.7" />
    <!-- British Isles & North Sea -->
    <path d="M 680,110 Q 730,95 760,115 T 730,145 T 670,135 Z" fill="#0f172a" opacity="0.65" />
    <path d="M 780,80 Q 820,68 870,88 T 880,130 T 820,135 Z" fill="#0f172a" opacity="0.6" />
    <!-- Eastern Europe & Asia Minor -->
    <path d="M 1000,170 Q 1120,160 1240,190 T 1360,250 T 1240,320 T 1070,265 Z" fill="#0f172a" opacity="0.7" />
    <!-- Mediterranean Waters Ribbon -->
    <path d="M 720,235 Q 790,225 850,245 T 920,265" fill="none" stroke="#172554" stroke-width="8" opacity="0.9" />

    <!-- 7. Night Side Illuminated City Light Clusters (Warm Amber-Gold) -->
    <g fill="#f59e0b">
      <!-- London Hub -->
      <circle cx="715" cy="130" r="3.5" fill="url(#cityGlow)" />
      <!-- Paris Hub -->
      <circle cx="755" cy="175" r="4.2" fill="url(#cityGlow)" />
      <circle cx="800" cy="180" r="3.8" fill="url(#cityGlow)" />
      <!-- Brussels/Amsterdam -->
      <circle cx="780" cy="150" r="3.5" fill="url(#cityGlow)" />
      <!-- Berlin Hub -->
      <circle cx="850" cy="145" r="4.0" fill="url(#cityGlow)" />
      <circle cx="900" cy="165" r="3.5" fill="url(#cityGlow)" />
      <!-- Madrid / Lisbon -->
      <circle cx="650" cy="225" r="3.8" fill="url(#cityGlow)" />
      <circle cx="615" cy="235" r="3.2" fill="url(#cityGlow)" />
      <!-- Rome / Italy -->
      <circle cx="860" cy="230" r="3.8" fill="url(#cityGlow)" />
      <circle cx="890" cy="255" r="3.2" fill="url(#cityGlow)" />
      <!-- Vienna / Prague -->
      <circle cx="875" cy="185" r="3.5" fill="url(#cityGlow)" />
      <!-- Warsaw / Moscow -->
      <circle cx="950" cy="155" r="3.8" fill="url(#cityGlow)" />
      <circle cx="1040" cy="160" r="4.0" fill="url(#cityGlow)" />
      <!-- Istanbul / Athens -->
      <circle cx="1020" cy="245" r="3.8" fill="url(#cityGlow)" />
      <circle cx="970" cy="265" r="3.2" fill="url(#cityGlow)" />
      <!-- Cairo / Nile Valley Ribbon -->
      <circle cx="1035" cy="300" r="4.0" fill="url(#cityGlow)" />
      <path d="M 1035,300 L 1045,340" stroke="#fbbf24" stroke-width="2.2" opacity="0.8" fill="none" filter="url(#softGlow)" />
    </g>

    <!-- Interconnected Network Constellation Web -->
    <g stroke="#38bdf8" stroke-width="1.0" opacity="0.45" stroke-dasharray="2.5 2.5">
      <line x1="715" y1="130" x2="755" y2="175" />
      <line x1="755" y1="175" x2="650" y2="225" />
      <line x1="650" y1="225" x2="615" y2="235" />
      <line x1="755" y1="175" x2="800" y2="180" />
      <line x1="800" y1="180" x2="850" y2="145" />
      <line x1="850" y1="145" x2="900" y2="165" />
      <line x1="800" y1="180" x2="860" y2="230" />
      <line x1="860" y1="230" x2="890" y2="255" />
      <line x1="850" y1="145" x2="950" y2="155" />
      <line x1="950" y1="155" x2="1040" y2="160" />
      <line x1="950" y1="155" x2="1020" y2="245" />
      <line x1="890" y1="255" x2="970" y2="265" />
      <line x1="970" y1="265" x2="1020" y2="245" />
      <line x1="1020" y1="245" x2="1035" y2="300" />
    </g>

    <!-- Golden Highlights on Primary Fiber Lines -->
    <g stroke="#fde047" stroke-width="1.2" opacity="0.6">
      <line x1="715" y1="130" x2="755" y2="175" />
      <line x1="755" y1="175" x2="800" y2="180" />
      <line x1="800" y1="180" x2="850" y2="145" />
      <line x1="850" y1="145" x2="950" y2="155" />
      <line x1="800" y1="180" x2="860" y2="230" />
    </g>

    <!-- Dense Cluster Sparkle Points -->
    <g fill="#fef08a" opacity="0.9">
      <circle cx="755" cy="175" r="1.8" />
      <circle cx="715" cy="130" r="1.6" />
      <circle cx="650" cy="225" r="1.6" />
      <circle cx="800" cy="180" r="1.6" />
      <circle cx="850" cy="145" r="1.8" />
      <circle cx="860" cy="230" r="1.6" />
      <circle cx="950" cy="155" r="1.8" />
      <circle cx="1040" cy="160" r="1.8" />
    </g>

    <!-- Atmospheric Swirling Cloud Wisps (Soft Opacity) -->
    <path d="M 350,110 Q 480,75 620,105 T 820,140 T 1000,120 T 1200,160 T 1400,210" fill="none" stroke="#ffffff" stroke-width="24" opacity="0.22" filter="url(#softGlow)" />
    <path d="M 260,165 Q 400,130 550,175 T 750,205 T 950,185" fill="none" stroke="#ffffff" stroke-width="20" opacity="0.18" filter="url(#softGlow)" />
    <path d="M 450,225 Q 560,190 710,235 T 900,265" fill="none" stroke="#ffffff" stroke-width="16" opacity="0.14" filter="url(#softGlow)" />
    <path d="M 220,85 Q 320,50 440,70 T 580,100" fill="none" stroke="#ffffff" stroke-width="28" opacity="0.28" filter="url(#softGlow)" />
  </g>

  <!-- 8. Luminous Atmosphere Boundary (Edge of Space) -->
  <path d="M -50,250 C 350,25 1100,35 1650,195" fill="none" stroke="url(#atmoGlow)" stroke-width="4.5" filter="url(#softGlow)" />
  <path d="M -50,250 C 350,25 1100,35 1650,195" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.85" />

  <!-- 9. Radiant Sunrise Sunburst on Horizon & Morning Light Wash -->
  <!-- Ambient Soft Daylight Wash behind Greeting Text Area -->
  <ellipse cx="230" cy="140" rx="340" ry="190" fill="#ffffff" opacity="0.32" filter="url(#sunBloom)" />
  <ellipse cx="180" cy="120" rx="250" ry="150" fill="#e0f2fe" opacity="0.4" filter="url(#sunBloom)" />

  <g transform="translate(350, 115)">
    <!-- Deep Lens Corona Bloom -->
    <circle cx="0" cy="0" r="190" fill="url(#sunCore)" filter="url(#sunBloom)" />
    <!-- Horizontal Lens Flare Beam Across Horizon -->
    <rect x="-380" y="-2.5" width="760" height="5" fill="url(#flareRay)" opacity="0.85" />
    <rect x="-240" y="-6" width="480" height="12" fill="url(#flareRay)" opacity="0.45" filter="url(#softGlow)" />
    <!-- Subtle Diagonal Lens Flare Streaks -->
    <line x1="-160" y1="-80" x2="160" y2="80" stroke="#fef08a" stroke-width="1.8" opacity="0.55" />
    <line x1="-110" y1="110" x2="110" y2="-110" stroke="#67e8f9" stroke-width="1.5" opacity="0.5" />
    <!-- Brilliant Radiant Sun Core -->
    <circle cx="0" cy="0" r="28" fill="#ffffff" filter="url(#softGlow)" />
    <circle cx="0" cy="0" r="14" fill="#ffffff" />
  </g>
</svg>
